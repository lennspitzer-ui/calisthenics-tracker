<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthenics Pro V2.1 Tracker</title>

    <!-- ============================================================ -->
    <!-- PWA – MANIFEST, THEME COLOR & SERVICE WORKER                 -->
    <!-- ============================================================ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <!-- Apple iOS / Safari (Standalone-Modus) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calisthenics Pro">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- Service Worker Registrierung -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[App] ServiceWorker registriert, Scope:', reg.scope))
                    .catch(err => console.warn('[App] ServiceWorker Fehler:', err));
            });
        }
    </script>
    <!-- ============================================================ -->

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#080c10',
                            card: '#111822',
                            border: '#1e293b',
                            neon: '#10b981',
                            cyan: '#06b6d4',
                            accent: '#34d399'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #080c10;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(18, 26, 38, 0.9), rgba(12, 17, 25, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Active Set Button Glow */
        .set-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .set-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #000000;
            font-weight: 800;
            border-color: #34d399;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
        }

        /* Pulse glow animation for timer */
        @keyframes timer-pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
        }

        .timer-running {
            animation: timer-pulse 2s infinite;
            border-color: #10b981 !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-28">

    <!-- App Header -->
    <header class="sticky top-0 z-40 bg-[#080c10]/90 backdrop-blur-md border-b border-gray-800/80 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 via-teal-400 to-cyan-400 flex items-center justify-center text-black font-black text-lg shadow-lg shadow-emerald-500/20">
                    C
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wider text-white leading-none flex items-center gap-1.5">
                        CALISTHENICS <span class="text-emerald-400 text-xs px-1.5 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">V2.1</span>
                    </h1>
                    <p class="text-[10px] text-gray-400 font-semibold tracking-widest uppercase mt-0.5">High Performance Tracker</p>
                </div>
            </div>

            <!-- Header Quick Timer Trigger -->
            <button id="openTimerHeaderBtn" onclick="toggleTimerModal()" class="flex items-center gap-2 bg-gray-900/90 border border-gray-800 hover:border-emerald-500/40 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-400 transition-all active:scale-95">
                <i class="fa-solid fa-stopwatch text-emerald-400"></i>
                <span id="headerTimerDisplay">Timer</span>
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="sticky top-[57px] z-30 bg-[#080c10]/95 border-b border-gray-800/50 py-2.5 px-4">
        <div class="max-w-md mx-auto">
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-0.5" id="tabsContainer">
                <button onclick="switchTab('push1')" id="tab-push1" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border border-transparent bg-gray-900 text-gray-400 hover:text-white flex flex-col items-center">
                    <span>PUSH 1</span>
                    <span class="text-[9px] font-normal opacity-60">Schulter/Skill</span>
                </button>
                <button onclick="switchTab('pull1')" id="tab-pull1" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border border-transparent bg-gray-900 text-gray-400 hover:text-white flex flex-col items-center">
                    <span>PULL 1</span>
                    <span class="text-[9px] font-normal opacity-60">Vertikal</span>
                </button>
                <button onclick="switchTab('beine')" id="tab-beine" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border border-transparent bg-gray-900 text-gray-400 hover:text-white flex flex-col items-center">
                    <span>BEINE</span>
                    <span class="text-[9px] font-normal opacity-60">Unterkörper</span>
                </button>
                <button onclick="switchTab('push2')" id="tab-push2" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border border-transparent bg-gray-900 text-gray-400 hover:text-white flex flex-col items-center">
                    <span>PUSH 2</span>
                    <span class="text-[9px] font-normal opacity-60">Brust/Trizeps</span>
                </button>
                <button onclick="switchTab('pull2')" id="tab-pull2" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border border-transparent bg-gray-900 text-gray-400 hover:text-white flex flex-col items-center">
                    <span>PULL 2</span>
                    <span class="text-[9px] font-normal opacity-60">Horizontal/V-Shape</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main App Container -->
    <main class="flex-1 px-4 max-w-md mx-auto w-full mt-4">
        
        <!-- Day Banner Info & Overall Progress -->
        <div class="glass-card rounded-2xl p-4 mb-4 relative overflow-hidden border-l-4 border-l-emerald-500">
            <div class="flex items-start justify-between">
                <div>
                    <div class="flex items-center gap-2">
                        <span id="dayBadge" class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Fokus</span>
                    </div>
                    <h2 id="dayTitle" class="text-base font-black text-white mt-1 tracking-wide">Push 1</h2>
                    <p id="daySubtitle" class="text-xs text-gray-400 mt-0.5">Pike Push-ups & Skill Fokus</p>
                </div>
                <div class="text-right">
                    <span id="dayProgressPercent" class="text-lg font-black text-emerald-400">0%</span>
                    <p id="dayProgressText" class="text-[10px] text-gray-400 font-semibold">0 / 0 Sätze</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-900/90 h-2 rounded-full mt-3.5 overflow-hidden p-0.5 border border-gray-800">
                <div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
        </div>

        <!-- Dynamic Exercises List Container -->
        <div id="exercisesContainer" class="space-y-3.5">
            <!-- Exercise cards injected via JavaScript -->
        </div>

        <!-- Global Action Controls for Day -->
        <div class="mt-6 flex items-center gap-3">
            <button onclick="checkAllCurrentDay()" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-black font-extrabold py-3.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition-all active:scale-[0.98]">
                <i class="fa-solid fa-check-double text-sm"></i>
                Tag Abschließen
            </button>
            <button onclick="resetCurrentDay()" class="bg-gray-900 border border-gray-800 hover:border-red-500/40 text-gray-400 hover:text-red-400 font-bold py-3.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                <i class="fa-solid fa-rotate-right"></i>
                Reset
            </button>
        </div>
    </main>

    <!-- Floating Rest Timer Overlay Widget (When running) -->
    <div id="floatingTimerWidget" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 hidden">
        <div class="glass-panel px-4 py-2.5 rounded-full flex items-center gap-3 border border-emerald-500/40 shadow-2xl timer-running bg-[#080c10]/95">
            <div class="flex items-center gap-2" onclick="toggleTimerModal()">
                <i class="fa-solid fa-stopwatch text-emerald-400 animate-pulse"></i>
                <span id="floatingTimerDisplay" class="font-mono font-black text-emerald-400 text-sm tracking-wider">01:30</span>
            </div>
            <div class="h-4 w-[1px] bg-gray-800"></div>
            <button onclick="pauseTimer()" id="floatingPlayPauseBtn" class="text-gray-300 hover:text-white text-xs p-1">
                <i class="fa-solid fa-pause"></i>
            </button>
            <button onclick="stopTimer()" class="text-gray-400 hover:text-red-400 text-xs p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Rest Timer Modal Sheet -->
    <div id="timerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel border-t border-gray-800 w-full max-w-md p-6 rounded-t-3xl sm:rounded-3xl shadow-2xl transition-all transform translate-y-10 sm:translate-y-0 bg-[#0d131a]">
            
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-stopwatch"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-white">Pausen-Timer</h3>
                        <p class="text-[10px] text-gray-400">Regeneration für maximale Power</p>
                    </div>
                </div>
                <button onclick="toggleTimerModal()" class="w-8 h-8 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Large Digital Clock Display -->
            <div class="text-center my-6 py-4 rounded-2xl bg-gray-950/80 border border-gray-800/80 relative overflow-hidden">
                <span id="modalTimerDisplay" class="font-mono text-5xl font-black tracking-widest text-emerald-400 drop-shadow-[0_0_15px_rgba(16,185,129,0.3)]">01:30</span>
                <p id="timerStateLabel" class="text-[10px] uppercase font-bold text-gray-500 mt-2 tracking-widest">Bereit</p>
            </div>

            <!-- Quick Preset Buttons -->
            <div class="grid grid-cols-4 gap-2 mb-6">
                <button onclick="setTimerSeconds(60)" class="py-2.5 rounded-xl bg-gray-900 border border-gray-800 hover:border-emerald-500/40 text-xs font-bold text-gray-300 hover:text-emerald-400 transition-all">60s</button>
                <button onclick="setTimerSeconds(90)" class="py-2.5 rounded-xl bg-gray-900 border border-gray-800 hover:border-emerald-500/40 text-xs font-bold text-gray-300 hover:text-emerald-400 transition-all">90s</button>
                <button onclick="setTimerSeconds(120)" class="py-2.5 rounded-xl bg-gray-900 border border-gray-800 hover:border-emerald-500/40 text-xs font-bold text-gray-300 hover:text-emerald-400 transition-all">2m</button>
                <button onclick="setTimerSeconds(180)" class="py-2.5 rounded-xl bg-gray-900 border border-gray-800 hover:border-emerald-500/40 text-xs font-bold text-gray-300 hover:text-emerald-400 transition-all">3m</button>
            </div>

            <!-- Timer Controls -->
            <div class="flex items-center gap-3">
                <button onclick="addTimerTime(30)" class="flex-1 py-3 rounded-xl bg-gray-900 border border-gray-800 hover:border-gray-700 text-xs font-bold text-gray-300">
                    +30s
                </button>
                <button id="modalStartPauseBtn" onclick="toggleTimerStartPause()" class="flex-[2] py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-play"></i> Start
                </button>
                <button onclick="stopTimer()" class="flex-1 py-3 rounded-xl bg-gray-900 border border-gray-800 text-xs font-bold text-gray-400 hover:text-red-400">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-4">
        <div class="glass-panel px-4 py-2 rounded-full text-xs font-bold text-emerald-400 border border-emerald-500/40 shadow-xl flex items-center gap-2">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage">Satz gespeichert!</span>
        </div>
    </div>

    <!-- Embedded JavaScript Logic -->
    <script>
        
        // Workout Data Schema V2.1
        const WORKOUT_DATA = {
            push1: {
                title: "Push 1 (Schulter & Skill)",
                subtitle: "Pike Push-ups, Dips & Tuck L-Sit",
                badge: "Schulter-Fokus",
                exercises: [
                    { id: "p1_1", name: "Elevated Pike Push-ups", target: "3 Sätze × 6-10 Wdh.", sets: 3, note: "Füße auf Stuhl/Sofa. Fokus Schultern & HSPU-Kraft." },
                    { id: "p1_2", name: "Bar Dips (Dip-Barren)", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Tiefe Bewegung, 1 Sekunde unten pausieren." },
                    { id: "p1_3", name: "Deficit Push-ups", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Auf Parallettes für maximalen Brust-Stretch." },
                    { id: "p1_4", name: "Diamond Push-ups", target: "2 Sätze × Max Wdh.", sets: 2, note: "Burnout am Boden für Trizeps & Brust." },
                    { id: "p1_5", name: "Tuck L-Sit Hold", target: "3 Sätze × 10-20 Sek.", sets: 3, note: "Auf Parallettes. Knie anziehen, Rumpf fest." }
                ]
            },
            pull1: {
                title: "Pull 1 (Vertikal & Muscle-Up)",
                subtitle: "Explosive Pull-ups & Ring Rows",
                badge: "Muscle-Up Prep",
                exercises: [
                    { id: "l1_1", name: "Explosive Pull-ups", target: "4 Sätze × 3-5 Wdh.", sets: 4, note: "An der Stange; maximal schnell hochziehen." },
                    { id: "l1_2", name: "Slow Negative Pull-ups", target: "3 Sätze × 4-6 Wdh.", sets: 3, note: "An der Stange; 5 Sekunden kontrolliert ablassen." },
                    { id: "l1_3", name: "Ring Australian Rows", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Ringe auf Bauchhöhe – alternativ: Stangen-Rows unter Pull-up-Stange." },
                    { id: "l1_4", name: "Ring Inverted Biceps Curls", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Alternativ mit Widerstandsband an der Stange." }
                ]
            },
            beine: {
                title: "Beine (Unterkörper & Athletik)",
                subtitle: "Single-leg Strength & Explosivität",
                badge: "Unterkörper",
                exercises: [
                    { id: "b1_1", name: "Bulgarian Split Squats", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Pro Bein; hinterer Fuß auf Stuhl/Couch." },
                    { id: "b1_2", name: "Walking Lunges", target: "3 Sätze × 12 Wdh.", sets: 3, note: "Pro Seite; dynamisch und aufrecht bleiben." },
                    { id: "b1_3", name: "Single-Leg Calf Raises", target: "3 Sätze × 15 Wdh.", sets: 3, note: "Wadenheben an einer Stufe mit voller Dehnung." },
                    { id: "b1_4", name: "Tuck Jumps", target: "2 Sätze × 10 Wdh.", sets: 2, note: "Explosive Sprünge, Knie hoch zur Brust." }
                ]
            },
            push2: {
                title: "Push 2 (Brust & Trizeps)",
                subtitle: "Bar Dips, Pseudo Planche & Hollow Hold",
                badge: "Brust-Fokus",
                exercises: [
                    { id: "p2_1", name: "Bar Dips (Dip-Barren)", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Erste Hauptübung; tief und sauber absenken." },
                    { id: "p2_2", name: "Pseudo Planche Push-ups", target: "3 Sätze × 6-10 Wdh.", sets: 3, note: "Schultern weit vor die Hände verlagern!" },
                    { id: "p2_3", name: "Diamond Push-ups", target: "3 Sätze × 8-12 Wdh.", sets: 3, note: "Kontrollierte Wiederholungen für den Trizeps." },
                    { id: "p2_4", name: "Pike Push-ups", target: "2 Sätze × Max Wdh.", sets: 2, note: "Schulter-Burnout am Boden zum Schluss." },
                    { id: "p2_5", name: "Hollow Body Hold", target: "3 Sätze × 30-45 Sek.", sets: 3, note: "Unterer Rücken bleibt fest am Boden gepresst." }
                ]
            },
            pull2: {
                title: "Pull 2 (Horizontal & V-Shape)",
                subtitle: "Chin-ups, Ring Rows & Face Pulls",
                badge: "V-Shape Build",
                exercises: [
                    { id: "l2_1", name: "Chin-ups (Untergriff)", target: "3 Sätze × 5-8 Wdh.", sets: 3, note: "An Stange; volle Distanz (Dead Hang bis Kinn über Stange)." },
                    { id: "l2_2", name: "Ring Rows (Untergriff)", target: "4 Sätze × 8-12 Wdh.", sets: 4, note: "Alternativ: Stangen-Rows mit Untergriff unter Pull-up-Stange." },
                    { id: "l2_3", name: "Wide Grip Negative Pull-ups", target: "3 Sätze × 4-6 Wdh.", sets: 3, note: "An Stange; breiter Griff für den oberen Latissimus." },
                    { id: "l2_4", name: "Ring Face Pulls", target: "3 Sätze × 10-12 Wdh.", sets: 3, note: "Alternativ: Face Pulls mit Loop-Band an der Stange auf Stirnhöhe." }
                ]
            }
        };

        // App State
        let currentDay = 'push1';
        let userState = {};

        // Rest Timer State
        let timerSecondsLeft = 0;
        let timerTotalDuration = 90;
        let timerInterval = null;
        let isTimerRunning = false;


        // Load persisted state from LocalStorage
        function loadSavedState() {
            try {
                const saved = localStorage.getItem('calisthenics_v2_1_state');
                if (saved) {
                    userState = JSON.parse(saved);
                }
            } catch (e) {
                console.error("Failed to load local storage state", e);
            }
        }

        // Save current state to LocalStorage
        function saveState() {
            try {
                localStorage.setItem('calisthenics_v2_1_state', JSON.stringify(userState));
            } catch (e) {
                console.error("Failed to save state", e);
            }
        }

        // Initialize state structure if empty
        function ensureStateStructure(dayId, exerciseId, setTotal) {
            if (!userState[dayId]) userState[dayId] = {};
            if (!userState[dayId][exerciseId]) {
                userState[dayId][exerciseId] = new Array(setTotal).fill(false);
            }
        }


        // Render current active tab content
        function renderDay() {
            const dayData = WORKOUT_DATA[currentDay];
            if (!dayData) return;

            // Update Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-emerald-500', 'to-teal-500', 'text-black', 'border-emerald-400');
                btn.classList.add('bg-gray-900', 'text-gray-400');
            });
            const activeTab = document.getElementById(`tab-${currentDay}`);
            if (activeTab) {
                activeTab.classList.remove('bg-gray-900', 'text-gray-400');
                activeTab.classList.add('bg-gradient-to-r', 'from-emerald-500', 'to-teal-500', 'text-black', 'border-emerald-400');
            }

            // Update Header Information
            document.getElementById('dayTitle').innerText = dayData.title;
            document.getElementById('daySubtitle').innerText = dayData.subtitle;
            document.getElementById('dayBadge').innerText = dayData.badge;

            // Render Exercise Cards
            const container = document.getElementById('exercisesContainer');
            container.innerHTML = '';

            let totalSetsInDay = 0;
            let completedSetsInDay = 0;

            dayData.exercises.forEach((ex, exIdx) => {
                ensureStateStructure(currentDay, ex.id, ex.sets);
                const exSets = userState[currentDay][ex.id];
                totalSetsInDay += ex.sets;

                const completedCount = exSets.filter(Boolean).length;
                completedSetsInDay += completedCount;
                const isAllDone = completedCount === ex.sets;

                // Exercise Card HTML
                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-4 transition-all duration-300 ${isAllDone ? 'border-emerald-500/40 bg-emerald-950/10' : ''}`;

                let setButtonsHtml = '';
                for (let s = 0; s < ex.sets; s++) {
                    const isChecked = exSets[s];
                    setButtonsHtml += `
                        <button onclick="toggleSet('${ex.id}', ${s})" 
                                class="set-btn flex-1 py-2.5 rounded-xl border border-gray-800 text-xs font-bold text-gray-400 bg-gray-900/80 hover:border-emerald-500/50 flex flex-col items-center justify-center gap-0.5 ${isChecked ? 'active' : ''}">
                            <span>Satz ${s + 1}</span>
                            <i class="fa-solid ${isChecked ? 'fa-check' : 'fa-plus'} text-[10px] opacity-80"></i>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3 mb-2">
                        <div>
                            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                ${ex.name}
                                ${isAllDone ? '<i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>' : ''}
                            </h3>
                            <p class="text-[11px] font-semibold text-emerald-400 mt-0.5">${ex.target}</p>
                        </div>
                        <button onclick="toggleAllSetsForExercise('${ex.id}', ${ex.sets})" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-gray-900 border border-gray-800 text-gray-400 hover:text-emerald-400 hover:border-emerald-500/30 transition-all">
                            ${isAllDone ? 'Reset' : 'Alle ✔'}
                        </button>
                    </div>

                    <p class="text-[11px] text-gray-400 mb-3.5 leading-relaxed bg-gray-950/40 p-2 rounded-lg border border-gray-900">
                        <i class="fa-solid fa-lightbulb text-amber-400/80 mr-1"></i> ${ex.note}
                    </p>

                    <div class="flex gap-2">
                        ${setButtonsHtml}
                    </div>
                `;

                container.appendChild(card);
            });

            // Update Day Progress Bar
            const percent = totalSetsInDay > 0 ? Math.round((completedSetsInDay / totalSetsInDay) * 100) : 0;
            document.getElementById('dayProgressPercent').innerText = `${percent}%`;
            document.getElementById('dayProgressText').innerText = `${completedSetsInDay} / ${totalSetsInDay} Sätze`;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        // Switch Tabs
        function switchTab(dayId) {
            currentDay = dayId;
            renderDay();
        }

        // Toggle Individual Set
        function toggleSet(exerciseId, setIdx) {
            const exSets = userState[currentDay][exerciseId];
            const newState = !exSets[setIdx];
            exSets[setIdx] = newState;

            saveState();
            renderDay();

            if (newState) {
                triggerQuickRestTimer(90);
                showToast("Satz abgeschlossen! Pausen-Timer gestartet.");
                if (navigator.vibrate) navigator.vibrate(40);
            }
        }

        // Toggle All Sets for an Exercise
        function toggleAllSetsForExercise(exerciseId, totalSets) {
            const exSets = userState[currentDay][exerciseId];
            const allChecked = exSets.every(Boolean);

            userState[currentDay][exerciseId] = new Array(totalSets).fill(!allChecked);
            saveState();
            renderDay();

            if (!allChecked) {
                showToast("Übung komplett abgehakt! 🔥");
                triggerQuickRestTimer(90);
                if (navigator.vibrate) navigator.vibrate([40, 50, 40]);
            }
        }

        // Complete whole current day
        function checkAllCurrentDay() {
            const dayData = WORKOUT_DATA[currentDay];
            dayData.exercises.forEach(ex => {
                userState[currentDay][ex.id] = new Array(ex.sets).fill(true);
            });
            saveState();
            renderDay();
            showToast("Tag komplett gemeistert! Stark 💪");
            if (navigator.vibrate) navigator.vibrate([60, 100, 60]);
        }

        // Reset current day
        function resetCurrentDay() {
            const dayData = WORKOUT_DATA[currentDay];
            dayData.exercises.forEach(ex => {
                userState[currentDay][ex.id] = new Array(ex.sets).fill(false);
            });
            saveState();
            renderDay();
            showToast("Tag zurückgesetzt.");
        }


        // Rest Timer Functions
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerUI() {
            const formatted = formatTime(timerSecondsLeft);
            document.getElementById('modalTimerDisplay').innerText = formatted;
            document.getElementById('floatingTimerDisplay').innerText = formatted;
            document.getElementById('headerTimerDisplay').innerText = isTimerRunning ? formatted : 'Timer';

            const startBtn = document.getElementById('modalStartPauseBtn');
            const floatPlayBtn = document.getElementById('floatingPlayPauseBtn');

            if (isTimerRunning) {
                startBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                floatPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('timerStateLabel').innerText = 'Pause läuft...';
                document.getElementById('floatingTimerWidget').classList.remove('hidden');
            } else {
                startBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
                floatPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                document.getElementById('timerStateLabel').innerText = timerSecondsLeft > 0 ? 'Pausiert' : 'Bereit';
            }
        }

        function triggerQuickRestTimer(secs) {
            timerTotalDuration = secs;
            timerSecondsLeft = secs;
            startTimer();
        }

        function setTimerSeconds(secs) {
            stopTimer();
            timerTotalDuration = secs;
            timerSecondsLeft = secs;
            updateTimerUI();
        }

        function addTimerTime(secs) {
            timerSecondsLeft += secs;
            updateTimerUI();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = true;
            updateTimerUI();

            timerInterval = setInterval(() => {
                if (timerSecondsLeft > 0) {
                    timerSecondsLeft--;
                    updateTimerUI();
                } else {
                    stopTimer();
                    playCompletionBeep();
                    showToast("Pause vorbei! Nächster Satz 🔥");
                    if (navigator.vibrate) navigator.vibrate([100, 100, 100]);
                }
            }, 1000);
        }

        function pauseTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = false;
            updateTimerUI();
        }

        function toggleTimerStartPause() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                if (timerSecondsLeft <= 0) timerSecondsLeft = 90;
                startTimer();
            }
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = false;
            timerSecondsLeft = 0;
            updateTimerUI();
            document.getElementById('floatingTimerWidget').classList.add('hidden');
            document.getElementById('headerTimerDisplay').innerText = 'Timer';
        }

        function toggleTimerModal() {
            const modal = document.getElementById('timerModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        // Web Audio API Audio Completion Beep
        function playCompletionBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.log('Audio Context error', e);
            }
        }


        // Toast Notification System
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2500);
        }

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedState();
            renderDay();
            updateTimerUI();
        });
    </script>
</body>
</html>
