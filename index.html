<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Calisthenics Pro – Workout-Tracker mit Live-Anzeige, Plan-Editor, Rekorden, Statistik und Offline-Funktion.">
<title>Calisthenics Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark only">
<meta name="supported-color-schemes" content="dark">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisthenics Pro">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
// --- Sichtbare Fehleranzeige statt Blank Screen ---
window.__fatal = function (msg) {
  try {
    var b = document.getElementById('fatal');
    if (!b) { b = document.createElement('div'); b.id = 'fatal'; document.body && document.body.appendChild(b); }
    b.innerHTML = '<b>Fehler in der App</b><br><code>' + String(msg).replace(/</g, '&lt;') + '</code><br><button onclick="hardReload()">Cache leeren &amp; neu laden</button>';
  } catch (e) {}
};
window.addEventListener('error', function (e) { window.__fatal(e.message + (e.lineno ? ' (Zeile ' + e.lineno + ')' : '')); });
window.hardReload = async function () {
  try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
  try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } catch (e) {}
  location.reload();
};
// --- Service Worker mit Update-Hinweis ---
if ('serviceWorker' in navigator) {
  var hadCtrl = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'activated' && hadCtrl) {
            var u = document.getElementById('updateBar'); if (u) u.classList.add('show');
          }
        });
      });
    }).catch(function (e) { console.warn('[SW]', e); });
  });
}
</script>
<style>
:root{
  --bg:#05070a; --bg2:#0b1017; --s1:#121a25; --s2:#19222f; --s3:#232d3b;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#eef2f7; --mu:#8b97a8; --di:#5b6778;
  --acc:#10b981; --day:#10b981; --warn:#f59e0b; --hot:#ef4444; --xp:#a78bfa;
  --r:18px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:dark only;
  forced-color-adjust:none;
}
html,body{background-color:#05070a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(520px 320px at 50% -120px,color-mix(in srgb,var(--day) 26%,transparent),transparent 70%),
             radial-gradient(400px 300px at 110% 30%,color-mix(in srgb,var(--day) 7%,transparent),transparent 70%);
  transition:background .6s}
.disp{font-family:'Space Grotesk','Inter',system-ui,sans-serif;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.ic.s{width:14px;height:14px}.ic.l{width:22px;height:22px}
.muted{color:var(--mu)}.dim{color:var(--di)}.sm{font-size:12px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--di)}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px calc(110px + var(--sb))}
.stack>*+*{margin-top:12px}
.view[hidden]{display:none}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.9,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}
.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}

/* Top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;margin:0 -16px;padding:calc(10px + var(--st)) 16px 10px;background:rgba(6,8,12,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.lvl{position:relative;width:44px;height:44px;flex-shrink:0}
.lvl svg{position:absolute;inset:0}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700}
.hello{flex:1;min-width:0}
.hello b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{font-size:11.5px;color:var(--mu);font-weight:600}
.tchip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--mu)}
.tchip.run{color:var(--day);border-color:color-mix(in srgb,var(--day) 50%,transparent);box-shadow:0 0 18px -6px var(--day)}

/* Cards & controls */
.card{background:linear-gradient(165deg,#141c28,#0d131b);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -22px #000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--tx);transition:transform .12s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:#f87171;border-color:rgba(239,68,68,.25)}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:11px}
.btn.icon{width:38px;height:38px;padding:0;border-radius:12px;color:var(--mu)}
.btn.prim{background:var(--acc);color:#03130c;border-color:transparent}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;background:var(--day);color:#03100b;font-weight:800;font-size:15px;box-shadow:0 14px 34px -14px var(--day);transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta .ic{stroke-width:2.6}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mu);padding:6px 0}
.link:active{color:var(--tx)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--mu);border:1px solid var(--line);white-space:nowrap}
.pill.acc{color:var(--day);background:color-mix(in srgb,var(--day) 13%,transparent);border-color:color-mix(in srgb,var(--day) 32%,transparent)}
.pill.warn{color:#fbbf24;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.pill.pr{color:#fde68a;background:linear-gradient(90deg,rgba(245,158,11,.25),rgba(239,68,68,.18));border-color:rgba(245,158,11,.45)}
.pill.alt{color:#67e8f9;background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.25)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-h h2{font-size:17px;font-weight:700}

/* Week strip */
.weekhead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}
.weekhead b{font-size:13px}
.goalbar{display:flex;gap:4px}
.goalbar i{width:16px;height:6px;border-radius:6px;background:var(--s3)}
.goalbar i.on{background:var(--acc);box-shadow:0 0 8px -2px var(--acc)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:13px;background:var(--s1);border:1px solid var(--line)}
.wd .d{font-size:10px;color:var(--di);font-weight:700;text-transform:uppercase}
.wd .n{font-weight:700;font-size:15px}
.wd .dots{display:flex;gap:2px;height:6px}
.wd .dots i{width:6px;height:6px;border-radius:50%}
.wd .dots i.e{background:var(--s3)}
.wd.today{border-color:color-mix(in srgb,var(--day) 60%,transparent);background:color-mix(in srgb,var(--day) 9%,var(--s1))}
.wd.future .n{color:var(--di)}

/* Day chips */
.days{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:100px;padding:10px 12px;border-radius:15px;background:var(--s1);border:1px solid var(--line);text-align:left;scroll-snap-align:start;transition:all .2s}
.dchip .dc-top{display:flex;align-items:center;gap:6px;height:14px;margin-bottom:4px}
.dchip .dc-top i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dchip em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fbbf24}
.dchip em.ok{color:var(--acc)}
.dchip b{display:block;font-size:14px;font-weight:700}
.dchip span{font-size:11px;color:var(--mu)}
.dchip.on{background:color-mix(in srgb,var(--c) 15%,var(--s1));border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 8px 24px -12px var(--c)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;margin-top:14px;
  background:radial-gradient(130% 120% at 100% 0%,color-mix(in srgb,var(--day) 30%,transparent),transparent 58%),linear-gradient(160deg,var(--s2),var(--bg2));
  border:1px solid color-mix(in srgb,var(--day) 32%,var(--line))}
.hero-top{display:flex;gap:14px;align-items:flex-start}
.hero-top>div:first-child{flex:1;min-width:0}
.hero h2{font-size:26px;font-weight:700;line-height:1.05;margin:8px 0 4px}
.hero p{font-size:12.5px;color:var(--mu)}
.ring{position:relative;width:86px;height:86px;flex-shrink:0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-size:22px;font-weight:700;line-height:1}
.ring .rv span{font-size:10px;color:var(--mu);font-weight:600;margin-top:2px}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.9,.2,1)}
.hero-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.hero-meta div{padding:9px 10px;border-radius:13px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.hero-meta b{display:block;font-size:15px;font-weight:700}
.hero-meta span{font-size:10.5px;color:var(--mu);font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mu);background:rgba(0,0,0,.25);border:1px dashed var(--line2)}
.chk .ic{width:13px;height:13px;opacity:.35}
.chk.on{color:var(--tx);border-style:solid;border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:rgba(16,185,129,.1)}
.chk.on .ic{opacity:1;color:var(--acc)}

/* Session card */
.row-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rpe-v{display:flex;align-items:baseline;gap:5px}
.rpe-v b{font-size:22px;font-weight:800;transition:color .2s}
.rpe-v small{font-size:11px;color:var(--di)}
#rpeEmoji{font-size:20px}
.rpe-slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;outline:none;background:#2a3544}
.rpe-slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--rc,#eab308);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--rc,#eab308),0 4px 12px rgba(0,0,0,.5)}
.rpe-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--rc,#eab308);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--rc,#eab308)}
.rpe-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--di);margin-top:6px;font-weight:600}
.hot #rpeEmoji{animation:glow 1s infinite}
.max #rpeEmoji{animation:glow 1s infinite,shake .3s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px rgba(239,68,68,.9))}}
@keyframes shake{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.note{width:100%;margin-top:14px;resize:none;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;padding:10px 12px;font-size:13px;color:var(--tx);line-height:1.4}
.note:focus{outline:none;border-color:color-mix(in srgb,var(--day) 50%,transparent)}
.note::placeholder{color:var(--di)}

/* Exercise cards */
.ex{position:relative;overflow:hidden;background:linear-gradient(165deg,#172030 0%,#111824 55%,#0d131c 100%);border:1px solid rgba(255,255,255,.11);border-radius:var(--r);padding:15px 14px 14px 17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 36px -20px #000,0 2px 8px -4px rgba(0,0,0,.8);transition:border-color .3s,background .3s}
.ex::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--day);opacity:.75}
.ex+.ex{margin-top:14px}
.ex.done{border-color:rgba(16,185,129,.4);background:linear-gradient(165deg,#12291f,#0d1a16 60%,#0c1419)}
.ex.done::before{background:var(--acc);opacity:1}
.ex-h{display:flex;gap:11px;align-items:flex-start}
.ex-n{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--day) 18%,#232d3b);color:var(--day)!important;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:var(--mu);flex-shrink:0}
.ex.done .ex-n{background:var(--acc);color:#03130c!important}
.ex-main{flex:1;min-width:0}
.ex-t{font-size:15px;font-weight:700;line-height:1.25}
.ex-s{font-size:12px;color:var(--day);font-weight:600;margin:2px 0 6px}
.ex-act{display:flex;gap:6px}
.ex-note{font-size:12px;color:var(--mu);margin:10px 0 12px;padding:9px 11px;background:rgba(0,0,0,.32);cursor:pointer;border-radius:11px;border:1px solid var(--line);line-height:1.45}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sets{display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:24px 38px minmax(44px,1fr) 38px 1.5fr;gap:6px;align-items:center}
.set-n{font-size:11px;font-weight:800;color:var(--di)}
.step{height:40px;border-radius:12px;background:#1c2634;border:1px solid rgba(255,255,255,.1);font-size:20px;font-weight:600;color:var(--mu);line-height:1}
.step:active{background:var(--s3);color:var(--tx)}
.val{height:40px;width:100%;text-align:center;border-radius:12px;background:#080c12;border:1px solid rgba(255,255,255,.1);font-weight:800;font-size:17px}
.val:focus{outline:none;border-color:var(--day)}
.done-btn{height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#1c2634;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--mu);transition:all .2s}
.done-btn .ic{width:16px;height:16px}
.done-btn .ghost{font-size:11px;color:var(--di);font-weight:600}
.done-btn.on{background:var(--acc);color:#03130c;border-color:transparent;box-shadow:0 0 20px -6px var(--acc)}
.set.is-done .val{color:var(--acc)}
.ex-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.endrow{display:flex;gap:10px;margin-top:18px}
.endrow .cta{flex:1}

/* Bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));z-index:40;display:flex;gap:4px;padding:6px;border-radius:24px;background:rgba(15,20,28,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 20px 44px -12px rgba(0,0,0,.8);width:calc(100% - 24px);max-width:456px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:18px;font-size:10.5px;font-weight:700;color:var(--di);transition:all .2s}
.nav button .ic{width:21px;height:21px}
.nav button.on{color:var(--tx);background:var(--s3)}
.nav button.on .ic{color:var(--day)}

/* Rest pill */
.restpill{position:fixed;left:50%;bottom:calc(84px + var(--sb));z-index:39;transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:rgba(15,20,28,.95);border:1px solid color-mix(in srgb,var(--rpc,var(--day)) 55%,transparent);box-shadow:0 10px 30px -8px var(--rpc,var(--day));overflow:hidden;transition:all .3s cubic-bezier(.2,.9,.2,1)}
.restpill.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.restpill .rp-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--rpc,var(--day));transition:width .25s linear}
.restpill b{font-size:17px;font-weight:700;color:var(--rpc,var(--day));min-width:52px}
.restpill span{font-size:11px;color:var(--mu);font-weight:600}
.restpill button{height:32px;min-width:32px;padding:0 10px;border-radius:999px;background:var(--s3);font-size:12px;font-weight:700;color:var(--tx)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,var(--s1),var(--bg2));border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + var(--sb));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.2,1)}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-h h3{font-size:18px;font-weight:700}
.sheet-h p{font-size:12px;color:var(--mu);margin-top:2px}
.opt{width:100%;display:block;text-align:left;padding:13px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-bottom:8px}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--mu)}
.opt.on{border-color:var(--day);background:color-mix(in srgb,var(--day) 10%,var(--s2))}

/* Timer sheet */
.bigtime{text-align:center;padding:22px 0;border-radius:20px;background:rgba(0,0,0,.3);border:1px solid var(--line);margin-bottom:14px}
.bigtime b{font-size:60px;font-weight:700;line-height:1;color:var(--day)}
.bigtime span{display:block;margin-top:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--di);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:10px 3px;white-space:nowrap;border-radius:11px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mu)}
.seg button.on{color:var(--tx);border-color:var(--acc);background:rgba(16,185,129,.13)}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow>*{flex:1}

/* Focus mode */
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding:calc(12px + var(--st)) 18px calc(18px + var(--sb));overflow:hidden}
.focus.open{display:flex}
.focus::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 420px at 50% 20%,color-mix(in srgb,var(--day) 22%,transparent),transparent 70%)}
.focus>*{position:relative}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-meta{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.f-seg{display:flex;gap:4px;margin:14px 0 0}
.f-seg i{flex:1;height:5px;border-radius:5px;background:var(--s3);overflow:hidden;position:relative}
.f-seg i::after{content:'';position:absolute;inset:0;width:var(--p,0%);background:var(--day);border-radius:5px;transition:width .4s}
.f-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;min-height:0}
.f-name{font-size:30px;font-weight:700;line-height:1.08;max-width:340px}
.f-dots{display:flex;gap:8px;align-items:center}
.f-dots i{width:10px;height:10px;border-radius:50%;background:var(--s3);transition:all .3s}
.f-dots i.done{background:var(--acc)}
.f-dots i.cur{width:28px;border-radius:6px;background:var(--day);box-shadow:0 0 12px -2px var(--day)}
.f-setlbl{font-size:13px;color:var(--mu);font-weight:600}
.f-counter{display:flex;align-items:center;gap:20px;margin:10px 0 4px}
.f-step{width:66px;height:66px;border-radius:50%;background:var(--s2);border:1px solid var(--line2);font-size:30px;font-weight:500;color:var(--tx);display:grid;place-items:center}
.f-step:active{transform:scale(.92);background:var(--s3)}
.f-val{font-size:104px;font-weight:700;line-height:.95;min-width:2.2ch}
.f-unit{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--di);font-weight:700}
.f-hint{font-size:13px;color:var(--mu)}
.f-hint b{color:var(--tx)}
.f-note{font-size:12.5px;color:var(--di);max-width:340px;line-height:1.45}
.f-cta{padding:20px;font-size:17px;border-radius:20px}
.f-sub{display:flex;justify-content:center;gap:18px;margin-top:10px}
.f-sub button{font-size:12.5px;font-weight:600;color:var(--di);padding:6px}
.f-ring{position:relative;width:250px;height:250px;margin:8px 0}
.f-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.f-ring::before{content:'';position:absolute;inset:14px;border-radius:50%;box-shadow:0 0 60px -14px var(--day),inset 0 0 40px -20px var(--day)}
.f-ring .ft{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.f-ring .ft b{font-size:66px;font-weight:700;line-height:1}
.f-next{width:100%;max-width:360px;text-align:left;display:flex;gap:12px;align-items:center}
.f-next .ex-n{background:color-mix(in srgb,var(--day) 22%,var(--s3));color:var(--day)}
.f-big{font-size:72px;line-height:1}

/* Toast, Burst, Update */
.toast{position:fixed;top:calc(12px + var(--st));left:50%;transform:translate(-50%,-160%);z-index:90;background:rgba(21,28,38,.96);border:1px solid var(--line2);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;transition:transform .35s cubic-bezier(.2,.9,.2,1);box-shadow:0 12px 30px -10px rgba(0,0,0,.8);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.burst{position:fixed;inset:0;z-index:95;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.burst.show{opacity:1}
.burst>div{text-align:center;padding:26px 30px;border-radius:28px;background:rgba(10,14,20,.92);border:1px solid rgba(245,158,11,.45);box-shadow:0 0 80px -10px rgba(245,158,11,.55);transform:scale(.7);transition:transform .45s cubic-bezier(.2,1.4,.3,1);max-width:86vw}
.burst.show>div{transform:scale(1)}
.burst .e{font-size:58px;line-height:1}
.burst b{display:block;font-size:26px;font-weight:700;margin-top:8px;background:linear-gradient(90deg,#fde68a,#f59e0b,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.burst span{display:block;font-size:13px;color:var(--mu);margin-top:6px}
.updbar{position:fixed;top:calc(10px + var(--st));left:50%;transform:translate(-50%,-180%);z-index:91;display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;border-radius:999px;background:var(--acc);color:#03130c;font-weight:800;font-size:13px;transition:transform .35s;box-shadow:0 10px 30px -8px var(--acc)}
.updbar.show{transform:translate(-50%,0)}
.updbar button{background:#03130c;color:var(--acc);padding:7px 12px;border-radius:999px;font-weight:800;font-size:12px}
#fatal{position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#2a0f12;border:1px solid #ef4444;color:#fecaca;padding:14px;border-radius:14px;font-size:13px;line-height:1.5}
#fatal code{font-size:11.5px;word-break:break-word}
#fatal button{margin-top:10px;background:#ef4444;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96}

/* Stats */
.lvcard{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,rgba(167,139,250,.22),transparent 55%),linear-gradient(160deg,var(--s2),var(--bg2));border:1px solid rgba(167,139,250,.28);border-radius:24px;padding:18px}
.lvcard .lv{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lvcard .lv b{font-size:44px;font-weight:700;line-height:.9}
.lvcard .lv small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--xp);font-weight:800;margin-bottom:6px}
.lvcard .ttl{font-size:16px;font-weight:700;text-align:right}
.xpbar{height:10px;border-radius:10px;background:rgba(0,0,0,.35);margin:16px 0 8px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#7c3aed,#a78bfa,#f0abfc);box-shadow:0 0 14px rgba(167,139,250,.6);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{padding:14px;border-radius:var(--r);background:linear-gradient(160deg,var(--s1),var(--bg2));border:1px solid var(--line)}
.kpi .ic{color:var(--day);margin-bottom:8px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.05}
.kpi span{font-size:11.5px;color:var(--mu);font-weight:600}
.chart{width:100%;display:block}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--s3);display:block}
.hm i.fut{background:transparent;border:1px dashed var(--line)}
.hm i.today{outline:2px solid var(--tx);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--mu);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}
.bal{display:grid;grid-template-columns:64px 1fr 44px;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px;font-weight:600}
.bal .tr{height:10px;border-radius:10px;background:var(--s3);overflow:hidden}
.bal .tr i{display:block;height:100%;border-radius:10px}
.bal .v{text-align:right;color:var(--mu)}
.insight{display:flex;gap:10px;align-items:flex-start;margin-top:6px;padding:11px 12px;border-radius:13px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:12.5px;color:var(--mu)}
.insight .ic{color:var(--warn);margin-top:1px}
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rec:last-child{border-bottom:0}
.rec .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rec .nm{flex:1;min-width:0}
.rec .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .nm span{font-size:11px;color:var(--di)}
.rec .bv{text-align:right}
.rec .bv b{font-size:17px;font-weight:700}
.rec .bv span{display:block;font-size:10.5px;font-weight:700}
.up{color:var(--acc)}.down{color:#f87171}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bdg{padding:13px 8px;border-radius:16px;text-align:center;background:linear-gradient(160deg,var(--s1),var(--bg2));border:1px solid var(--line)}
.bdg .e{font-size:30px;line-height:1.1}
.bdg b{display:block;font-size:11.5px;margin-top:6px;line-height:1.2}
.bdg span{display:block;font-size:10px;color:var(--di);margin-top:3px;line-height:1.25}
.bdg.got{border-color:rgba(245,158,11,.3);background:linear-gradient(160deg,rgba(245,158,11,.09),var(--bg2))}
.bdg.locked .e{filter:grayscale(1);opacity:.28}
.bdg.locked b{color:var(--di)}

/* Log */
.wkh{display:flex;justify-content:space-between;margin:20px 2px 8px;font-size:12px;font-weight:700;color:var(--di);letter-spacing:.06em;text-transform:uppercase}
.sess{display:block;width:100%;text-align:left;position:relative;overflow:hidden;padding:14px 14px 14px 18px;border-radius:var(--r);background:linear-gradient(160deg,var(--s1),var(--bg2));border:1px solid var(--line)}
.sess+.sess{margin-top:8px}
.sess::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sess-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sess-h b{font-size:15px;font-weight:700}
.sess-h small{display:block;font-size:12px;color:var(--mu);margin-top:1px}
.sess-m{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--mu);font-weight:600}
.sess-m span{display:inline-flex;align-items:center;gap:5px}
.sess-d{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:none}
.sess.open .sess-d{display:block}
.sess-d div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0}
.sess-d div span:first-child{color:var(--mu)}
.sess-d i{display:block;font-size:12.5px;color:var(--mu);margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--mu)}
.empty .e{font-size:44px;margin-bottom:10px}

/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:14px;font-weight:600}
.set-row span{font-size:12px;color:var(--mu)}
.sw{width:48px;height:29px;border-radius:99px;background:var(--s3);position:relative;transition:background .2s;flex-shrink:0;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#94a3b8;transition:all .2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:22px;background:#fff}
.inp{width:100%;padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:14px}
.inp:focus{outline:none;border-color:var(--day)}
.sub-l{font-size:12.5px;font-weight:600;margin:14px 0 8px}
.foot{text-align:center;font-size:11px;color:var(--di);margin-top:20px;line-height:1.6}

/* ===== V6 ===== */
.live{position:fixed;left:50%;bottom:calc(84px + var(--sb));z-index:39;width:calc(100% - 24px);max-width:456px;transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;padding:9px 9px 9px 10px;border-radius:20px;background:rgba(17,24,34,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--lc,var(--day)) 55%,transparent);box-shadow:0 16px 36px -12px color-mix(in srgb,var(--lc,var(--day)) 55%,#000);overflow:hidden;transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .3s,border-color .3s}
.live.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.live-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--lc,var(--day));transition:width .3s linear}
.live-ic{position:relative;width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--lc,var(--day)) 16%,transparent);color:var(--lc,var(--day));cursor:pointer}
.live-ic svg.rg{position:absolute;inset:1px;width:42px;height:42px;transform:rotate(-90deg)}
.live-tx{flex:1;min-width:0;text-align:left;display:block}
.live-k{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lc,var(--day))}
.live-tx b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.live-tx small{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-act{display:flex;gap:6px}
.live-act button{height:44px;min-width:44px;padding:0 11px;border-radius:13px;background:var(--s3);font-weight:800;font-size:12.5px;display:grid;place-items:center}
.live-act button.go{background:var(--lc,var(--day));color:#03100b;min-width:52px}
.live-act button.go .ic{stroke-width:3}
body.has-live .app{padding-bottom:calc(190px + var(--sb))}
.nav button{font-size:10px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-top:14px}
.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13px;color:var(--mu)}
.tabs button.on{background:var(--s3);color:var(--tx);box-shadow:0 4px 12px -6px #000}
.prow{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:15px;background:linear-gradient(165deg,#161f2c,#0f151e);border:1px solid rgba(255,255,255,.1)}
.prow+.prow{margin-top:8px}
.prow .nm{flex:1;min-width:0;text-align:left}
.prow .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm span{font-size:11.5px;color:var(--mu)}
.prow .gd{width:5px;height:34px;border-radius:4px;flex-shrink:0}
.mv{display:flex;flex-direction:column;gap:3px}
.mv button{width:32px;height:20px;border-radius:7px;background:var(--s2);border:1px solid var(--line);color:var(--mu);font-size:10px;display:grid;place-items:center}
.mv button:disabled{opacity:.25}
.fld{margin-top:14px}
.fld>label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:7px}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:19px;font-weight:600}
.stp button:active{background:var(--s3)}
.stp b{min-width:46px;text-align:center;font-size:19px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.swatches button.on{border-color:#fff}
.preview{margin-top:16px;padding:12px;border-radius:13px;background:rgba(0,0,0,.3);border:1px dashed var(--line2);font-size:13px}
.preview b{color:var(--day)}
.alt-row{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);margin-bottom:8px}
.alt-row .top{display:flex;gap:6px}
.alt-row .top .inp{flex:1}
.addrow{width:100%;padding:14px;border-radius:15px;border:1.5px dashed var(--line2);color:var(--mu);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:13px}
.addrow:active{background:var(--s1)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{position:relative;text-align:left;padding:14px;border-radius:18px;background:linear-gradient(165deg,#172030,#0e141d);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 28px -20px #000;min-height:138px;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.rcard:active{transform:scale(.98)}
.rcard .e{font-size:28px;line-height:1}
.rcard .n{font-size:13px;font-weight:700;margin-top:8px;padding-right:30px}
.rcard .v{font-size:28px;font-weight:700;line-height:1.05;margin-top:auto;padding-top:8px}
.rcard .v small{font-size:12px;color:var(--mu);font-weight:600;margin-left:4px}
.rcard .d{font-size:11px;color:var(--di);font-weight:600;margin-top:2px}
.rcard .add{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;background:var(--acc);color:#03130c;display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--acc)}
.rcard .add .ic{stroke-width:3}
.rcard.empty .v{color:var(--di);font-size:15px}
.rcard.fresh{border-color:rgba(245,158,11,.5);background:linear-gradient(165deg,rgba(245,158,11,.14),#0e141d)}
.recin{width:150px;text-align:center;font-size:64px;font-weight:700;line-height:1;background:transparent;border:0;border-bottom:2px solid var(--line2);color:var(--tx);padding:4px 0}
.recin:focus{outline:none;border-color:var(--acc)}
.datein{color-scheme:dark}
/* Signalisiert Browsern (Samsung Internet, Chrome Auto-Dark): Seite ist bereits dunkel → nicht nachträglich abdunkeln */
@media (prefers-color-scheme:dark){:root{color-scheme:dark only}html,body{background-color:#05070a}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.set{grid-template-columns:20px 34px minmax(40px,1fr) 34px 1.2fr}.f-val{font-size:86px}.f-ring{width:220px;height:220px}}

let WORKOUT_DATA = {}, DAY_ORDER = [], DAY_META = {}, _defPlan = null;

function planEx(e) {
    const max = !e.range && /Max/i.test(e.target || '');
    const side = (/\/(Bein|Seite)/.exec(e.target || '') || [])[1] || '';
    const range = max ? null : (e.range ? [...e.range] : [e.defaultReps, e.defaultReps]);
    return { id: e.id, group: e.group, name: e.name, sets: e.sets, unit: e.unit, range, max, side, defaultReps: e.defaultReps, note: e.note, rest: null,
        alternatives: (e.alternatives || []).map(a => {
            const o = { id: a.id, name: a.name, note: a.note };
            if (a.range !== undefined) { const d = a.defaultReps ?? e.defaultReps; o.range = a.range ? [...a.range] : [d, d]; }
            if (a.defaultReps != null) o.defaultReps = a.defaultReps;
            return o;
        }) };
}
function defaultPlan() {
    return { v: 1, days: DEFAULT_ORDER.map(id => {
        const d = DEFAULT_PLAN[id], m = DEFAULT_META[id];
        return { id, short: m.short, sub: m.sub, badge: d.badge, desc: d.subtitle, c: m.c, wd: [], exercises: d.exercises.map(planEx) };
    }) };
}
function fmtVal(v) { return Number.isInteger(+v) ? String(+v) : String(+(+v).toFixed(2)).replace('.', ','); }
function genTarget(e) {
    const u = (UNITS[e.unit] || UNITS.reps).n;
    const r = e.max ? 'Max' : e.range ? (e.range[0] === e.range[1] ? fmtVal(e.range[0]) : fmtVal(e.range[0]) + '-' + fmtVal(e.range[1])) : fmtVal(e.defaultReps);
    return `${e.sets} × ${r} ${u}${e.side ? '/' + e.side : ''}`;
}
function activePlan() { return appMeta.plan || (_defPlan ||= defaultPlan()); }
function editablePlan() { if (!appMeta.plan) appMeta.plan = clone(_defPlan ||= defaultPlan()); return appMeta.plan; }
function applyPlan() {
    const p = activePlan();
    WORKOUT_DATA = {}; DAY_ORDER = []; DAY_META = {};
    Object.keys(EX_INDEX).forEach(k => delete EX_INDEX[k]); Object.keys(EX_ORDER).forEach(k => delete EX_ORDER[k]);
    p.days.forEach((d, di) => {
        DAY_ORDER.push(d.id); DAY_META[d.id] = { short: d.short, sub: d.sub || '', c: d.c || PALETTE[di % PALETTE.length], wd: d.wd || [] };
        WORKOUT_DATA[d.id] = { title: d.short, subtitle: d.desc || '', badge: d.badge || d.short, exercises: (d.exercises || []).map((e, i) => {
            const ex = { ...e, range: e.max ? null : e.range, target: genTarget(e),
                alternatives: (e.alternatives || []).map(a => { const m = { ...e, ...a }; return { ...a, range: (a.range ?? (e.max ? null : e.range)), defaultReps: a.defaultReps ?? e.defaultReps, target: genTarget(m) }; }) };
            EX_INDEX[e.id] = { day: d.id, ex }; EX_ORDER[e.id] = di * 100 + i; return ex;
        }) };
    });
}

function lineChart(vals, labels, color) {
    if (vals.length < 2) return `<div class="empty" style="padding:24px 10px"><p class="sm">Ab 2 Einheiten erscheint hier dein Verlauf</p></div>`;
    const W = 320, H = 130, px = 14, pt = 18, pb = 22, mx = Math.max(...vals), mn = Math.min(...vals), rg = mx - mn || 1;
    const pts = vals.map((v, i) => [px + i * (W - 2 * px) / (vals.length - 1), pt + (1 - (v - mn) / rg) * (H - pt - pb)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const step = Math.ceil(vals.length / 6);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${pts[pts.length - 1][0]},${H - pb} L${pts[0][0]},${H - pb}Z" fill="url(#lg)"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="${i === pts.length - 1 ? color : '#0a0e14'}" stroke="${color}" stroke-width="2"/>${(i % step === 0 || i === pts.length - 1) ? `<text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="700">${vals[i]}</text><text x="${p[0]}" y="${H - 6}" text-anchor="middle" fill="#5b6778" font-size="9" font-weight="600">${labels[i]}</text>` : ''}`).join('')}
    </svg>`;
}
function barChart(weeks) {
    const W = 320, H = 140, pb = 22, pt = 18, n = weeks.length, gap = 8, bw = (W - gap * (n + 1)) / n, mx = Math.max(1, ...weeks.map(w => w.v));
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${weeks.map((w, i) => {
        const h = Math.max(w.v ? 4 : 2, (w.v / mx) * (H - pt - pb)), x = gap + i * (bw + gap), y = H - pb - h, cur = i === n - 1;
        return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${cur ? 'var(--day)' : 'rgba(255,255,255,.12)'}"/>${w.v ? `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" fill="${cur ? '#eef2f7' : '#8b97a8'}" font-size="9.5" font-weight="700">${w.v >= 1000 ? (w.v / 1000).toFixed(1) + 'k' : w.v}</text>` : ''}<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" fill="${cur ? '#eef2f7' : '#5b6778'}" font-size="9" font-weight="700">KW${kw(w.m)}</text>`;
    }).join('')}</svg>`;
}

function focusAdj(d) {

// Halte-Timer für Sekunden-Übungen: 3 s Vorlauf, zählt hoch, Ziel-Signal, Stopp speichert die Zeit
let hold = null, holdH = null;
function holdToggle(silent) {

// ================================================================
// TIMER (zeitstempelbasiert – läuft auch bei gesperrtem Bildschirm korrekt)
// ================================================================
let rest = { running: false, end: 0, total: 90, remain: 90, type: 'set' }, tickH = null, lastBeep = -1;
function restLeft() { return rest.running ? Math.max(0, Math.ceil((rest.end - Date.now()) / 1000)) : rest.remain; }
function startRest(secs, type = 'set') {
    rest = { running: true, end: Date.now() + secs * 1000, total: secs, remain: secs, type };
    lastBeep = -1; saveTimer(); loop(); requestWakeLock(); updTimerUI();
}
function loop() { clearInterval(tickH); tickH = setInterval(tick, 200); }
function tick() {
    const l = restLeft();
    if (rest.running && setting('countdown', true) && l <= 3 && l > 0 && l !== lastBeep) { lastBeep = l; tone(660, .1, .16); vibe(20); }
    updTimerUI();
    if (rest.running && l <= 0) finishRest();
}
function finishRest() {
    clearInterval(tickH); rest.running = false; rest.remain = 0; saveTimer();
    tone(880, .3, .28); setTimeout(() => tone(1175, .45, .28), 170); vibe([120, 80, 120]);
    if (focus && focus.phase === 'rest') { focus.phase = 'work'; focusRender(); }
    else toast('Pause vorbei – nächster Satz 🔥');
    updTimerUI(); if (!focus) releaseWakeLock();
}
function stopRest() { clearInterval(tickH); rest.running = false; rest.remain = rest.total; saveTimer(); updTimerUI(); if (!focus) releaseWakeLock(); }
function pauseRest() { if (!rest.running) return; rest.remain = restLeft(); rest.running = false; clearInterval(tickH); saveTimer(); updTimerUI(); }
function resumeRest() { const s = rest.remain > 0 ? rest.remain : rest.total; rest.running = true; rest.end = Date.now() + s * 1000; lastBeep = -1; saveTimer(); loop(); updTimerUI(); requestWakeLock(); }
function addRest(s) {
    if (rest.running) { rest.end = Math.max(Date.now() + 1000, rest.end + s * 1000); rest.total = Math.max(5, rest.total + s); }
    else { rest.remain = Math.max(0, rest.remain + s); rest.total = Math.max(rest.total, rest.remain); }
    saveTimer(); updTimerUI();
}
function saveTimer() { try { localStorage.setItem(TIMER_KEY, JSON.stringify(rest)); } catch (e) {} }
function restoreTimer() {
    try {
        const d = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null'); if (!d) return;
        if ('end' in d) rest = { ...rest, ...d };
        else { rest.total = d.total || 90; rest.remain = d.remaining ?? rest.total; if (d.running && d.endTimestamp) { rest.running = true; rest.end = d.endTimestamp; } }
        if (rest.running) { if (rest.end > Date.now()) loop(); else { rest.running = false; rest.remain = 0; } }
    } catch (e) {}
}
function updTimerUI() {
    const l = restLeft(), t = fmtTime(l), run = rest.running, col = rest.type === 'exercise' ? '#f59e0b' : 'var(--day)';

    const cols = [day, '#ffffff', '#f59e0b', '#a78bfa', '#38bdf8', '#f472b6'];
    const P = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .38, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 5 + 3, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0], s: Math.random() * .5 + .4 }));

    else if (key === 'defaultReps') d.defaultReps = r(d.defaultReps + dir * step);
    else if (key === 'r0') {
        const v = r(d.range[0] + dir * step);
        if (draftType() === 'fixed') { d.range = [v, v]; d.defaultReps = v; }
        else { d.range[0] = v; if (d.range[1] < v) d.range[1] = v; }
    } else if (key === 'r1') d.range[1] = Math.max(d.range[0], r(d.range[1] + dir * step));
    if (key !== 'defaultReps' && !d.max && (d.defaultReps < d.range[0] || d.defaultReps > d.range[1])) d.defaultReps = d.range[0];
    renderEditSheet();
}
function addAlt() { draft.alternatives.push({ id: uid('a_'), name: '', note: '' }); renderEditSheet(); setTimeout(() => { const ins = document.querySelectorAll('.alt-row .top .inp'); ins[ins.length - 1]?.focus(); }, 50); }
function delAlt(i) { draft.alternatives.splice(i, 1); renderEditSheet(); }
function saveEx() {
    const name = (draft.name || '').trim(); if (!name) { toast('Bitte einen Namen eingeben'); $('#dName')?.focus(); return; }
    const e = { ...draft, name, note: (draft.note || '').trim(), alternatives: draft.alternatives.filter(a => a.name.trim()).map(a => ({ ...a, name: a.name.trim(), note: (a.note || '').trim() })) };
    if (e.max) e.range = null;
    const d = editablePlan().days.find(x => x.id === draftCtx.day);
    const i = d.exercises.findIndex(x => x.id === e.id);
    if (i >= 0) d.exercises[i] = e; else d.exercises.push(e);
    if (userState.variants?.[e.id] && !e.alternatives.some(a => a.id === userState.variants[e.id])) delete userState.variants[e.id];
    closeSheet(); commitPlan(i >= 0 ? 'Übung gespeichert ✓' : 'Übung hinzugefügt ✓');
}
function dupEx() {
    const d = editablePlan().days.find(x => x.id === draftCtx.day), i = d.exercises.findIndex(x => x.id === draftCtx.id);
    const c = { ...clone(draft), id: uid('x_'), name: (draft.name || 'Übung') + ' (Kopie)' };
    c.alternatives = c.alternatives.map(a => ({ ...a, id: uid('a_') }));
    d.exercises.splice(i + 1, 0, c); closeSheet(); commitPlan('Übung dupliziert');
}
function delEx() {
    const ctx = { ...draftCtx }, nm = draft.name;
    confirmSheet(`„${esc(nm)}" löschen?`, 'Die Übung wird aus dem Plan entfernt. Ihr bisheriger Verlauf bleibt im Backup gespeichert.', 'Löschen', () => {
        const d = editablePlan().days.find(x => x.id === ctx.day); d.exercises = d.exercises.filter(x => x.id !== ctx.id);
        commitPlan('Übung gelöscht');
    }, true);
}

// ================================================================
// REKORDE: manuell eingetragen, mit Verlauf (Datum + Wert)
// ================================================================
function recDefs() { return appMeta.recordDefs || DEFAULT_RECORDS; }
function recDef(k) { return recDefs().find(r => r.k === k); }
function recEntries(k) { return (appMeta.records?.[k] || []).slice().sort((a, b) => a.date === b.date ? (a.t || 0) - (b.t || 0) : (a.date < b.date ? -1 : 1)); }
function recWalk(k) { let run = -Infinity; return recEntries(k).map(e => { const isRec = e.val > run; if (isRec) run = e.val; return { ...e, isRec }; }); }
function recBest(k) { let b = null; recEntries(k).forEach(e => { if (!b || e.val > b.val) b = e; }); return b; }
function recImprovements() { return recDefs().reduce((n, d) => n + recWalk(d.k).filter(e => e.isRec).length, 0); }
function recParts(v, u) {
    if (u === 'sec' && v >= 60) return { v: Math.floor(v / 60) + ':' + String(Math.round(v % 60)).padStart(2, '0'), u: 'min' };
    return { v: fmtVal(v), u: (REC_UNITS[u] || REC_UNITS.reps).n };
}
function recFmt(v, u) { const p = recParts(v, u); return p.v + ' ' + p.u; }

function renderRecords() {
    const defs = recDefs(), today = todayStr();
    const cards = defs.map(d => {
        const b = recBest(d.k), es = recEntries(d.k), first = es[0], fresh = b && daysBetween(b.date, today) <= 3, p = b ? recParts(b.val, d.u) : null;
        return `<div class="rcard ${b ? '' : 'empty'} ${fresh ? 'fresh' : ''}" role="button" tabindex="0" onclick="recDetail('${d.k}')">
          <div class="e">${esc(d.e)}</div><div class="n">${esc(d.n)}</div>
          <div class="v disp num">${b ? p.v + '<small>' + p.u + '</small>' : 'Noch leer'}</div>
          <div class="d">${b ? (fresh ? '🔥 ' : '') + 'am ' + fmtDate(b.date) + (es.length > 1 && b.val > first.val ? ' · ▲ +' + fmtVal(b.val - first.val) : '') : 'Tippe ＋ zum Eintragen'}</div>
          <button class="add" onclick="event.stopPropagation();recAdd('${d.k}')" aria-label="${esc(d.n)} eintragen">${ic('plus')}</button></div>`;
    }).join('');
    const recent = defs.flatMap(d => recWalk(d.k).map(e => ({ ...e, d }))).sort((a, b) => a.date === b.date ? (b.t || 0) - (a.t || 0) : (a.date < b.date ? 1 : -1)).slice(0, 8);
    $('#view-rec').innerHTML = `
      <div class="sec-h" style="margin-top:16px"><h2>Rekorde</h2><span class="dim sm">${recImprovements()} aufgestellt</span></div>
      <p class="sm muted" style="margin:-4px 2px 12px">Trag deine Bestleistung ein – jeder Eintrag landet mit Datum im Rekord-Verlauf. Neuer Bestwert = Feier 🏆</p>
      <div class="rgrid">${cards}</div>
      <button class="addrow" onclick="recEdit(null)">${ic('plus')} Eigene Kategorie (z. B. Körpergewicht, 5-km-Lauf)</button>
      <div class="sec-h"><h2>Letzte Einträge</h2></div>
      <div class="card" style="padding:4px 16px">${recent.length ? recent.map(e => `<button class="rec" onclick="recDetail('${e.d.k}')"><span style="font-size:20px">${esc(e.d.e)}</span><div class="nm"><b>${esc(e.d.n)}</b><span>${fmtLong(e.date)}</span></div><div class="bv"><b class="disp num">${recFmt(e.val, e.d.u)}</b>${e.isRec ? '<span style="color:#fbbf24">🏆 Rekord</span>' : '<span class="dim">Eintrag</span>'}</div></button>`).join('') : '<p class="muted sm" style="padding:14px 0">Noch keine Einträge – leg mit deinem ersten Rekord los.</p>'}</div>`;
}

// ---------- Eintragen ----------
let recDraft = null;
function recAdd(k) {
    const d = recDef(k), b = recBest(k);
    recDraft = { k, val: b ? b.val : (d.u === 'sec' ? 30 : d.u === 'kg' ? 80 : 10), date: todayStr() };
    const p = b ? recFmt(b.val, d.u) : null;
    openSheet(`<div class="sheet-h"><div><h3>${esc(d.e)} ${esc(d.n)} eintragen</h3><p>${b ? `Aktueller Rekord: <b style="color:var(--tx)">${p}</b> am ${fmtDate(b.date)}` : 'Dein erster Eintrag in dieser Kategorie'}</p></div><button class="btn icon" onclick="closeSheet()">${ic('x')}</button></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 4px">
        <button class="f-step" onclick="recStep(-1)" aria-label="weniger">−</button>
        <div style="text-align:center"><input id="recIn" class="recin disp num" type="number" step="any" inputmode="decimal" value="${fmtVal(recDraft.val).replace(',', '.')}" oninput="recHint()" onfocus="this.select()"><div class="f-unit">${(REC_UNITS[d.u] || REC_UNITS.reps).n}${d.u === 'sec' ? ' (Sekunden)' : ''}</div></div>
        <button class="f-step" onclick="recStep(1)" aria-label="mehr">+</button>
      </div>
      <div id="recHint" class="f-hint" style="text-align:center;min-height:20px;margin:8px 0 4px"></div>
      <div class="fld"><label>Datum</label><input id="recDate" class="inp datein" type="date" value="${recDraft.date}" max="${todayStr()}"></div>
      <button class="cta" style="margin-top:16px" onclick="recSave()">${ic('trophy')} Speichern</button>`);
    recHint();
}
function recVal() { const v = parseFloat(String($('#recIn')?.value ?? '').replace(',', '.')); return Number.isFinite(v) ? Math.round(v * 100) / 100 : 0; }
function recStep(dir) {
    const d = recDef(recDraft.k), st = (REC_UNITS[d.u] || REC_UNITS.reps).step;
    const v = Math.max(0, Math.round((recVal() + dir * st) * 100) / 100); $('#recIn').value = v; recHint(); vibe(8);
}
function recHint() {
    const d = recDef(recDraft.k), b = recBest(recDraft.k), v = recVal(), h = $('#recHint'); if (!h) return;
    h.innerHTML = !v ? '' : !b ? `= <b>${recFmt(v, d.u)}</b>` : v > b.val ? `🏆 <b style="color:#fbbf24">Neuer Rekord!</b> +${fmtVal(Math.round((v - b.val) * 100) / 100)} gegenüber vorher` : v === b.val ? 'Rekord eingestellt 💪' : `Noch ${fmtVal(Math.round((b.val - v) * 100) / 100)} bis zum Rekord`;
}
function recSave() {
    const d = recDef(recDraft.k), v = recVal();
    if (!(v > 0)) { toast('Bitte einen Wert eingeben'); return; }
    let date = $('#recDate')?.value || todayStr(); if (date > todayStr()) date = todayStr();
    const prev = recBest(d.k);
    ((appMeta.records ||= {})[d.k] ||= []).push({ date, val: v, t: Date.now() });
    save(); closeSheet();
    if (!prev || v > prev.val) {
        burst(prev ? '🏆' : '🏁', prev ? 'Neuer Rekord!' : 'Erster Rekord!', `${d.n}: ${recFmt(v, d.u)}${prev ? ' (vorher ' + recFmt(prev.val, d.u) + ')' : ''}`);
        confetti(prev ? 120 : 60); vibe([60, 40, 60, 40, 180]); tone(784, .12, .2); setTimeout(() => tone(1047, .25, .2), 120);
        setTimeout(checkBadges, 2600);
    } else toast(`Eingetragen · Rekord bleibt ${recFmt(prev.val, d.u)}`);
    renderView();
}

// ---------- Detail ----------
function recDetail(k) {
    const d = recDef(k); if (!d) return;
    const es = recWalk(k), b = recBest(k), first = es[0];
    const imp = b && first && es.length > 1 ? b.val - first.val : null;
    openSheet(`<div class="sheet-h"><div><h3>${esc(d.e)} ${esc(d.n)}</h3><p>${es.length} Einträge · Einheit ${(REC_UNITS[d.u] || REC_UNITS.reps).n}</p></div><button class="btn icon" onclick="closeSheet()">${ic('x')}</button></div>
      <div class="kpis" style="margin-bottom:12px">
        <div class="kpi">${ic('trophy')}<b class="disp num">${b ? recParts(b.val, d.u).v : '–'}</b><span>Rekord${b ? ' · ' + fmtDate(b.date) : ''}</span></div>
        <div class="kpi">${ic('trend')}<b class="disp num ${imp > 0 ? 'up' : ''}">${imp == null ? '–' : (imp > 0 ? '+' : '') + fmtVal(Math.round(imp * 100) / 100)}</b><span>seit erstem Eintrag</span></div>
      </div>
      <div class="card" style="margin-bottom:12px"><div class="lbl" style="margin-bottom:8px">Verlauf</div>${lineChart(es.slice(-12).map(e => e.val), es.slice(-12).map(e => fmtDate(e.date)), '#f59e0b')}</div>
      <button class="cta" onclick="recAdd('${k}')">${ic('plus')} Neuer Eintrag</button>
      <div class="lbl" style="margin:18px 2px 6px">Alle Einträge</div>
      <div class="card" style="padding:4px 14px">${es.length ? [...es].reverse().map(e => `<div class="rec"><span style="font-size:16px;width:22px">${e.isRec ? '🏆' : '·'}</span><div class="nm"><b>${recFmt(e.val, d.u)}</b><span>${fmtLong(e.date)}${e.isRec ? ' · damals Rekord' : ''}</span></div><button class="btn icon" onclick="recDel('${k}',${e.t || 0},'${e.date}',${e.val})" aria-label="Eintrag löschen">${ic('trash', 's')}</button></div>`).join('') : '<p class="muted sm" style="padding:12px 0">Noch keine Einträge.</p>'}</div>
      <div class="btnrow" style="margin-top:14px"><button class="btn" onclick="recEdit('${k}')">${ic('edit', 's')} Kategorie bearbeiten</button><button class="btn danger" onclick="recDelCat('${k}')">${ic('trash', 's')} Kategorie</button></div>`);
}
function recDel(k, t, date, val) {
    const a = appMeta.records?.[k]; if (!a) return;
    const i = a.findIndex(e => (e.t || 0) === t && e.date === date && e.val === val);
    if (i >= 0) { a.splice(i, 1); save(); toast('Eintrag gelöscht'); }
    recDetail(k); renderView();
}

// ---------- Kategorien ----------
let recEditDraft = null;
function recEdit(k) {
    const d = k ? recDef(k) : null;
    recEditDraft = d ? { ...d } : { k: null, n: '', u: 'reps', e: '🏅' };
    renderRecEdit();
}
function renderRecEdit() {
    const r = recEditDraft;
    openSheet(`<div class="sheet-h"><div><h3>${r.k ? 'Kategorie bearbeiten' : 'Neue Rekord-Kategorie'}</h3><p>z. B. Muscle-ups, Körpergewicht, 5-km-Lauf</p></div><button class="btn icon" onclick="closeSheet()">${ic('x')}</button></div>
      <div class="two" style="grid-template-columns:76px 1fr">
        <div class="fld" style="margin-top:0"><label>Emoji</label><input class="inp" style="text-align:center;font-size:20px" value="${esc(r.e)}" maxlength="4" oninput="recEditDraft.e=this.value"></div>
        <div class="fld" style="margin-top:0"><label>Name</label><input class="inp" id="reName" value="${esc(r.n)}" maxlength="24" placeholder="Name" oninput="recEditDraft.n=this.value"></div>
      </div>
      <div class="fld"><label>Einheit</label><div class="seg">${Object.keys(REC_UNITS).map(u => `<button class="${u === r.u ? 'on' : ''}" onclick="recEditDraft.u='${u}';renderRecEdit()">${REC_UNITS[u].n}</button>`).join('')}</div></div>
      ${r.k && (appMeta.records?.[r.k] || []).length ? '<p class="sm dim" style="margin-top:10px">Hinweis: Eine andere Einheit ändert vorhandene Einträge nicht.</p>' : ''}
      <button class="cta" style="margin-top:18px" onclick="recEditSave()">${ic('check')} Speichern</button>`);
}
function recEditSave() {
    const r = recEditDraft, n = (r.n || '').trim(); if (!n) { toast('Bitte einen Namen eingeben'); return; }
    const defs = clone(recDefs()), o = { k: r.k || uid('r_'), n, u: r.u, e: (r.e || '').trim() || '🏅' };
    const i = defs.findIndex(x => x.k === o.k); if (i >= 0) defs[i] = o; else defs.push(o);
    appMeta.recordDefs = defs; save(); closeSheet(); renderView(); toast(i >= 0 ? 'Kategorie gespeichert' : 'Kategorie angelegt');
}
function recDelCat(k) {
    const d = recDef(k);
    confirmSheet(`„${esc(d.n)}" löschen?`, 'Die Kategorie und alle ihre Einträge werden gelöscht.', 'Löschen', () => {
        appMeta.recordDefs = clone(recDefs()).filter(x => x.k !== k); if (appMeta.records) delete appMeta.records[k];
        save(); renderView(); toast('Kategorie gelöscht');
    }, true);
}

// ================================================================
// INIT
// ================================================================
function init() {
    load(); applyPlan(); migrateV2();
    currentDay = computeSuggestedDay();
    restoreTimer();
    checkBadges(true);
    go('train');
    updTimerUI();
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { if ($('#sheet').classList.contains('open')) closeSheet(); else if (focus) focusClose(); }
        if (focus && focus.phase === 'work' && (e.key === 'Enter' || e.key === ' ') && !$('#sheet').classList.contains('open')) { e.preventDefault(); focusDone(); }
    });
    // Tageswechsel (App bleibt offen über Mitternacht)
    let lastDay = todayStr();
    setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); _cache = null; currentDay = computeSuggestedDay(); if (!focus) renderView(); } }, 60000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
