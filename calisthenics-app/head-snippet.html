<!--
  ============================================================
  PWA HEAD-BLOCK – in den <head> deiner index.html einfügen
  Direkt nach den bestehenden <meta charset> und <viewport> Tags
  ============================================================
-->

<!-- PWA Manifest & Theme Color -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">

<!-- Apple iOS / Safari (Standalone-Modus) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisthenics Pro">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Service Worker Registrierung -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('[App] ServiceWorker registriert, Scope:', reg.scope);
        })
        .catch(err => {
          console.warn('[App] ServiceWorker Fehler:', err);
        });
    });
  }
</script>
